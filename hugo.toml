baseURL = "https://brightredtechnologies.com/"
languageCode = "en-us"
title = "Bright Red Technologies"
theme = "papermod"

# ------------------------------------------------------------------
#  OPTIONAL: Ignore patterns – keep ONLY what you truly need.
# ------------------------------------------------------------------
ignoreFiles = ["\\.Rmd$"]   # keep only R‑markdown notebooks

# ------------------------------------------------------------------
#  Site‑wide parameters (used by PaperMod)
# ------------------------------------------------------------------
[params]
  showBreadcrumbs = true
  breadcrumbSeparator = "›"
  breadcrumbHomeLabel = "Home"
  breadcrumbCurrentLabel = "You are here"
  cover.relative = true

# ------------------------------------------------------------------
#  Menus
# ------------------------------------------------------------------
[menu]

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 20

  [[menu.main]]
    name = "FAQ"
    url = "/faq/"
    weight = 30

# ------------------------------------------------------------------
#  OPTIONAL: Permalink format (PaperMod default)
# ------------------------------------------------------------------
[permalinks]
  posts = "/:slug/"

